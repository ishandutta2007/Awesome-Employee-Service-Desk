<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity="0.3" />
    </pattern>

    <style>
      .bg-pulse-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .bg-pulse-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .card-float-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .card-float-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .card-float-3 {
        animation: float3 8s ease-in-out infinite alternate;
      }
      .pill-pulse {
        animation: badgePulse 3s ease-in-out infinite;
      }
      .flow-dash {
        stroke-dasharray: 6 6;
        animation: flowDash 20s linear infinite;
      }

      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.2) translate(40px, -20px); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.25) translate(-50px, 30px); opacity: 0.6; }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(14px); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic / Animated Background Glow Elements (Deep Underlay) -->
  <g filter="blur(60px)">
    <circle class="bg-pulse-1" cx="220" cy="180" r="160" fill="url(#cyanGlow)" />
    <circle class="bg-pulse-2" cx="980" cy="190" r="170" fill="url(#purpleGlow)" />
  </g>

  <!-- Dynamic / Animated Workflow Stream (Mid-ground decorative lines) -->
  <g opacity="0.45">
    <path class="flow-dash" d="M 50 80 Q 300 20 600 80 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-dash" d="M 50 300 Q 350 340 600 280 T 1150 300" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Left Dynamic Metric Card (Floating in background / side) -->
  <g class="card-float-1" transform="translate(45, 120)">
    <rect width="180" height="95" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="28" cy="30" r="10" fill="#38bdf8" fill-opacity="0.2" />
    <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">⚡</text>
    <text x="48" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">IT Service Desk</text>
    <text x="22" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">99.8% SLA</text>
    <text x="22" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Automated Routing &amp; AI</text>
  </g>

  <!-- Right Dynamic Metric Card (Floating in background / side) -->
  <g class="card-float-2" transform="translate(975, 120)">
    <rect width="180" height="95" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="28" cy="30" r="10" fill="#c084fc" fill-opacity="0.2" />
    <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c084fc" text-anchor="middle">👥</text>
    <text x="48" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">HR Service Delivery</text>
    <text x="22" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#c084fc">Omnichannel</text>
    <text x="22" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Slack, Teams &amp; Portals</text>
  </g>

  <!-- Dynamic Bottom Activity Bar (Subtle animated indicator) -->
  <g class="card-float-3" transform="translate(420, 290)">
    <rect width="360" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
    <circle cx="445" cy="307" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="460" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">
      Enterprise SaaS &amp; Open-Source Hub • 2026 Ready
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges (Clean, unobstructed, prominent) -->
  <g transform="translate(600, 0)">
    <!-- Top Animated Pill Badge -->
    <g class="pill-pulse" transform="translate(0, 52)">
      <rect x="-140" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="1.5">
        ✦ CURATED ECOSYSTEM DIRECTORY ✦
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">
      Awesome Employee Service Desk
    </text>

    <!-- Subtitle 1 -->
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.2">
      Enterprise IT Support • HR Service Delivery • AI-Powered Helpdesks
    </text>

    <!-- Subtitle 2 / Description -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Comprehensive comparison of top SaaS leaders, pricing tiers, and production-grade self-hosted open-source software
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 245)">
      <rect x="-240" y="0" width="95" height="22" rx="11" fill="#0369a1" fill-opacity="0.35" stroke="#0ea5e9" stroke-width="1" />
      <text x="-192" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">#ITSM</text>

      <rect x="-135" y="0" width="95" height="22" rx="11" fill="#4338ca" fill-opacity="0.35" stroke="#6366f1" stroke-width="1" />
      <text x="-87" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">#ESM</text>

      <rect x="-30" y="0" width="115" height="22" rx="11" fill="#6d28d9" fill-opacity="0.35" stroke="#8b5cf6" stroke-width="1" />
      <text x="27" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#ddd6fe" text-anchor="middle">#HRService</text>

      <rect x="95" y="0" width="145" height="22" rx="11" fill="#be185d" fill-opacity="0.35" stroke="#ec4899" stroke-width="1" />
      <text x="167" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#fbcfe8" text-anchor="middle">#SelfHostedHelpdesk</text>
    </g>
  </g>
</svg>
